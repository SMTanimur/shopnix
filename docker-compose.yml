services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: shopnix-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - API_PREFIX=api/v1
      - CORS_ORIGIN=http://localhost:5000
      - MONGODB_URI=mongodb://mongo:27017/shopnix
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dev-secret-key-shopnix-development-min-32-chars-long
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_SECRET=dev-refresh-secret-key-shopnix-development
      - JWT_REFRESH_EXPIRATION=7d
      - ENCRYPTION_KEY=shopnix-dev-encryption-key-32ch
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - LOG_DIR=/app/apps/api/logs
    volumes:
      # Mount application source for live real-time code reloading without restarting
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - ./apps/api/logs:/app/apps/api/logs
      # Isolate node_modules to preserve container Linux dependencies
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shopnix-network

  mongo:
    image: mongo:8.0
    container_name: shopnix-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shopnix-network

  redis:
    image: redis:7-alpine
    container_name: shopnix-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shopnix-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  shopnix-network:
    driver: bridge
