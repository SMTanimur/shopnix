services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: shopnix-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_APP_NAME=Shopnix
    depends_on:
      api:
        condition: service_healthy
    networks:
      - shopnix-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: shopnix-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - API_PREFIX=api/v1
      - CORS_ORIGIN=http://localhost:3000
      - MONGODB_URI=mongodb://mongo:27017/shopnix
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=production-secret-change-this-in-env-file-min-32-chars
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_SECRET=production-refresh-secret-change-this-in-env-file
      - JWT_REFRESH_EXPIRATION=7d
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shopnix-network

  mongo:
    image: mongo:8.0
    container_name: shopnix-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shopnix-network

  redis:
    image: redis:7-alpine
    container_name: shopnix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shopnix-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  shopnix-network:
    driver: bridge
