services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: shopnix-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - API_PREFIX=api/v1
      - CORS_ORIGIN=http://localhost:5000
      - MONGODB_URI=mongodb://mongo:27017/shopnix
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dev-secret-key-shopnix-development-min-32-chars-long
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_SECRET=dev-refresh-secret-key-shopnix-development
      - JWT_REFRESH_EXPIRATION=7d
      - ENCRYPTION_KEY=shopnix-dev-encryption-key-32ch
      - LOG_DIR=/app/apps/api/logs
    # ---------------------------------------------------------------------------
    # NO bind mounts for source code.
    #
    # WHY: The workspace lives under "c:\tanim\New folder\shopnix".
    #      Docker Desktop for Windows cannot create bind-mount paths when a
    #      parent directory name contains a space.  The daemon tries:
    #        mkdir /run/desktop/mnt/host/c/tanim/New folder/shopnix
    #      which splits on the space and fails with "file exists" or I/O error.
    #
    # HOW live-reload works instead:
    #   • `make docker-dev`  uses `docker compose watch` (Compose file watch)
    #     which syncs file changes into the running container without bind mounts.
    #   • `make docker-build` rebuilds the image after larger changes.
    # ---------------------------------------------------------------------------
    develop:
      watch:
        # Sync API source files into the container on save
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src
        # Sync shared packages on save
        - action: sync
          path: ./packages
          target: /app/packages
        # Rebuild container when dependencies change
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./package.json
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shopnix-network

  mongo:
    image: mongo:8.0
    container_name: shopnix-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - shopnix-network

  redis:
    image: redis:7-alpine
    container_name: shopnix-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shopnix-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  shopnix-network:
    driver: bridge
