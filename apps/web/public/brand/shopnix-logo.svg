<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none">
  <defs>
    <linearGradient id="logo-icon-bg" x1="4" y1="4" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="logo-bolt-grad" x1="20" y1="20" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="logo-nix-grad" x1="120" y1="18" x2="190" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="spark-color" x1="32" y1="12" x2="42" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="logo-drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#E11D48" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. ICON MARK (Shopping Bag + Lightning Bolt + Spark) -->
  <g filter="url(#logo-drop-shadow)">
    <!-- Base Squircle -->
    <rect x="4" y="5" width="44" height="44" rx="13" fill="url(#logo-icon-bg)" />

    <!-- Top Specular Sheen -->
    <path d="M4 18C4 10.8 10.8 5 18 5H34C41.2 5 48 10.8 48 18V22L4 32V18Z" fill="#FFFFFF" fill-opacity="0.12" />

    <!-- Bag Handle -->
    <path
      d="M20 18C20 13.5 22.8 10.5 26 10.5C29.2 10.5 32 13.5 32 18"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Bag Body -->
    <path
      d="M14 18.5H38L35.4 39.5C35.1 41.7 33.2 43.5 31 43.5H21C18.8 43.5 16.9 41.7 16.6 39.5L14 18.5Z"
      fill="#FFFFFF"
    />

    <!-- Speed Bolt in Bag Center -->
    <path
      d="M28 22L19.5 31.5H25L23 39.5L33 29.5H27.5L28 22Z"
      fill="url(#logo-bolt-grad)"
    />

    <!-- Innovation Spark -->
    <path
      d="M37 9C37 11.5 35 13 32.5 13C35 13 37 14.5 37 17C37 14.5 39 13 41.5 13C39 13 37 11.5 37 9Z"
      fill="url(#spark-color)"
    />
  </g>

  <!-- 2. BRAND WORDMARK -->
  <text
    x="58"
    y="35"
    font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif"
    font-size="26"
    font-weight="900"
    letter-spacing="-0.04em"
    fill="#0F172A"
  >
    Shop<tspan fill="url(#logo-nix-grad)">nix</tspan>
  </text>

  <!-- 3. OS BADGE PILL -->
  <rect x="176" y="20" width="28" height="17" rx="5" fill="#FFE4E6" stroke="#FECDD3" stroke-width="1" />
  <text
    x="190"
    y="32.5"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="9.5"
    font-weight="800"
    letter-spacing="0.05em"
    fill="#E11D48"
    text-anchor="middle"
  >
    OS
  </text>
</svg>
